# Redis: el broker de Celery (el Temporizador del RF-13). Sin disco a
# propósito: lo que guarda son tareas en vuelta, no datos del negocio.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  replicas: 1
  # La cuota del namespace (2 CPU) no deja espacio para levantar el pod
  # nuevo antes de bajar el viejo: con RollingUpdate el despliegue se traba.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis, app.kubernetes.io/part-of: ojoalgasto }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # 64Mi y no 16Mi: el LimitRange del namespace
            # (student-provisioner-limits) exige un minimo de 25m de CPU y
            # 64Mi de memoria POR CONTENEDOR, y rechaza el pod al crearlo:
            #   pods "redis-..." is forbidden: minimum memory usage per
            #   Container is 64Mi, but request is 16Mi
            # Estuvo mal desde cd9daf7 sin que se notara, porque el pod que
            # corria era de un ReplicaSet anterior y nadie lo recreo hasta
            # que desplegar.sh reemplazo el broker.
            requests: { cpu: 25m,  memory: 64Mi }
            limits:   { cpu: 50m,  memory: 64Mi }
---
# RabbitMQ: el bus de eventos entre servicios del ADR-003.
#
# Mide 136Mi en reposo (medido 2026-10-19), de ahí el límite de 256Mi.
# Ya se usa: `subscriptions` despacha acá los eventos de su outbox
# (MX-21/VI-26), y el consumidor del mismo servicio los toma de la cola
# `subscriptions.resumen` para recalcular el resumen de la organización.
# Con EVENTOS_ASINCRONOS=0 ese mismo trabajo se hace dentro del POST: esa
# es la comparación con y sin cola (k8s/pruebas/comparar-cola.sh).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: panel, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  replicas: 1
  # La cuota del namespace (2 CPU) no deja espacio para levantar el pod
  # nuevo antes de bajar el viejo: con RollingUpdate el despliegue se traba.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata:
      labels: { app: rabbitmq, app.kubernetes.io/part-of: ojoalgasto }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: ojoalgasto-rabbitmq, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: ojoalgasto-rabbitmq, key: RABBITMQ_PASSWORD }
            # ── El nodo tiene nombre FIJO, no el del pod ──────────────────
            # Los datos viven en el PVC, en una carpeta que lleva el nombre
            # del nodo. Si el nombre sigue al pod, cada reemplazo arranca un
            # nodo distinto y abandona la carpeta anterior. Este valor ya
            # estaba en el cluster y tiene que quedar EN EL MANIFIESTO: si no,
            # el proximo despliegue limpio se lo lleva sin que nadie lo note.
            - name: RABBITMQ_NODENAME
              value: rabbit@rabbitmq-6b6ccf87b9-zcfmp
            # ── Erlang ve 8 CPU y la cuota da 0,1 ────────────────────────
            # El contenedor ve los 8 nucleos del nodo, asi que la maquina
            # virtual de Erlang arranca 8 planificadores que ademas hacen
            # espera activa. Con un limite de 100m el cgroup la estrangula:
            # medido en este pod, 119s de CPU usada contra 2396s
            # ESTRANGULADA, 12.071 periodos frenados. El broker arranca, pero
            # `rabbitmq-diagnostics ping` --que levanta OTRA maquina virtual--
            # nunca alcanza turno: tarda mas de 150s y la probe da 25s. El pod
            # jamas queda Listo, el Service se queda sin endpoints y el broker
            # resulta inalcanzable aunque este corriendo.
            #
            # `+S 1:1 +A 1` ajusta los planificadores a la CPU que de verdad
            # hay; `+sbwt none` apaga la espera activa, que es la que quema la
            # cuota sin hacer nada.
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 1:1 +A 1 +sbwt none +sbwtdcpu none +sbwtdio none"
            # Lo mismo para la maquina virtual de la CLI, que es la que corre
            # la probe. Tambien estaba en el cluster y faltaba en el manifiesto.
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "+S 1:1 +A 1"
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: panel, containerPort: 15672 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 6
          resources:
            # 300m y no 100m: con 100m el cgroup estrangula el arranque
            # hasta hacerlo inviable --medido: 35s de CPU usada contra 332s
            # estrangulada-- y la probe nunca pasa, asi que el Service se
            # queda sin endpoints y el broker resulta inalcanzable aunque
            # este corriendo. En reposo consume mucho menos; esto es para que
            # pueda ARRANCAR. Sigue cabiendo en la cuota con los dos HPA al
            # maximo (ver k8s/pruebas/presupuesto.py).
            requests: { cpu: 50m,  memory: 112Mi }
            limits:   { cpu: 300m, memory: 256Mi }
