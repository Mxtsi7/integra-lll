        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [ingress-nginx, kube-system] }
          podSelector:
            matchLabels: { app.kubernetes.io/component: controller }
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx, rke2-ingress-nginx] }
      ports:
        - { protocol: TCP, port: 8000 }
