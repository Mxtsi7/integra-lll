          podSelector:
            matchLabels: { app.kubernetes.io/component: controller }
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx, rke2-ingress-nginx] }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dominio-a-postgres
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [auth, auth-eliminaciones, subscriptions, connectors, analytics, notifications, subscriptions-worker, subscriptions-beat, connectors-worker, analytics-worker] }
      ports:
        - { protocol: TCP, port: 5432 }
    # notifications repartido (k8s/reparto.env, NS_NOTIFICATIONS): la API, el
    # consumidor (mismo pod) y los Jobs de alertas (componente: alertas) usan
    # el PostgreSQL del núcleo. Solo ese namespace y solo app: notifications; un
    # podSelector sin namespaceSelector no los alcanza.
    # No va a Redis: notifications no trae cliente de Redis ni de Celery, y el
    # CELERY_BROKER_URL que le llega con el ConfigMap compartido no lo lee
    # nadie. Por eso sesiones-y-tareas-a-redis no se le abre.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: student-maximiliano-saez-cd928ab3cf06 }
          podSelector:
            matchLabels: { app: notifications }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sesiones-y-tareas-a-redis
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, auth, auth-eliminaciones, subscriptions, connectors, analytics, notifications, subscriptions-worker, subscriptions-beat, connectors-worker, analytics-worker] }
      ports:
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eventos-a-rabbitmq
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [auth, auth-eliminaciones, subscriptions, connectors, analytics, notifications, subscriptions-worker, subscriptions-beat, connectors-worker, analytics-worker] }
      ports:
        - { protocol: TCP, port: 5672 }
    # notifications repartido (k8s/reparto.env, NS_NOTIFICATIONS): la API, el
    # consumidor (mismo pod) y los Jobs de alertas (componente: alertas) usan
    # el RabbitMQ del núcleo. Solo ese namespace y solo app: notifications; un
    # podSelector sin namespaceSelector no los alcanza.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: student-maximiliano-saez-cd928ab3cf06 }
          podSelector:
            matchLabels: { app: notifications }
      ports:
        - { protocol: TCP, port: 5672 }
