# ADR-004: gateway valida la identidad de usuario. auth-eliminaciones es un
# worker confiable adicional; sus operaciones internas requieren firma HMAC.
# Requiere un CNI que implemente NetworkPolicy. No restringe salidas OAuth/SMTP.
# El aislamiento se limita a pods de Ojo al Gasto, sin afectar otros proyectos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ojoalgasto-denegar-entrada
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: ojoalgasto }
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-gateway-auth
spec:
  podSelector:
    matchLabels: { app: auth }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway] }
      ports:
        - { protocol: TCP, port: 8001 }
    # S3-FE-21: los Jobs de alertas de notifications consultan el directorio
    # de destinatarios (ruta interna, firma HMAC). Solo ellos (componente
    # alertas), no la API de notifications, y solo desde el núcleo o desde el
    # satélite de notifications de k8s/reparto.env: auth confía en las
    # cabeceras de identidad del gateway, así que no se abre a cualquiera.
    - from:
        - podSelector:
            matchLabels: { app: notifications, componente: alertas }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: student-maximiliano-saez-cd928ab3cf06 }
          podSelector:
            matchLabels: { app: notifications, componente: alertas }
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-gateway-subscriptions
spec:
