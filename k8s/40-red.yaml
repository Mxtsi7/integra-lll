# ADR-004: solo gateway puede enviar identidad a las APIs internas.
# Requiere un CNI que implemente NetworkPolicy. No restringe salidas OAuth/SMTP.
# El aislamiento se limita a pods de Ojo al Gasto, sin afectar otros proyectos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ojoalgasto-denegar-entrada
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: ojoalgasto }
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-gateway-auth
spec:
  podSelector:
    matchLabels: { app: auth }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway] }
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-gateway-subscriptions
spec:
  podSelector:
    matchLabels: { app: subscriptions }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway] }
      ports:
        - { protocol: TCP, port: 8002 }
---
apiVersion: networking.k8s.io/v1
