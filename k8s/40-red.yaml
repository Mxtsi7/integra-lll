---
# Comparador con cuota propia: ambos selectores pertenecen al mismo peer.
# No autoriza otros pods ni namespaces, ni acceso a las APIs de dominio.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comparador-externo-a-gateway
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: student-carga }
          podSelector:
            matchLabels: { app: carga-comparar }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-a-web
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [ingress-nginx, kube-system] }
          podSelector:
            matchLabels: { app.kubernetes.io/component: controller }
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx, rke2-ingress-nginx] }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-a-gateway
spec:
