---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-a-gateway
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [web, carga-fortio, carga-comparar, diagnostico] }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-a-web
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [ingress-nginx, kube-system] }
          podSelector:
            matchLabels: { app.kubernetes.io/component: controller }
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx, rke2-ingress-nginx] }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
