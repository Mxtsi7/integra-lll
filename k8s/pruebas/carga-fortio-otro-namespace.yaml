# Prueba de carga DESDE EL NAMESPACE DE OTRA PERSONA.
#
# Cada integrante lo aplica en SU propio namespace, con SU kubeconfig. No
# necesita acceso al namespace del proyecto: los Services de Kubernetes se
# alcanzan entre namespaces por su nombre completo.
#
#   kubectl apply -f carga-fortio-otro-namespace.yaml      # en tu namespace
#   kubectl logs -f job/carga-desde-afuera
#   kubectl delete -f carga-fortio-otro-namespace.yaml
#
# ⚠️ LAS DOS COSAS QUE HAY QUE RESPETAR, Y POR QUÉ
#
# 1. El nombre va completo: `gateway.student-forellana.svc.cluster.local`.
#    El nombre corto `gateway` solo resuelve dentro del namespace del proyecto.
#
# 2. Hay que mandar `-H "Host: gateway"`.
#    Los servicios corren con DEBUG=False, así que Django rechaza cualquier
#    Host que no esté en ALLOWED_HOSTS, y ahí está `gateway` pero NO el nombre
#    completo. Sin esta cabecera **todas las peticiones responden 400** y la
#    prueba no mide nada.
#
#    Comprobado:
#      gateway:8000                                      -> 200
#      gateway.student-forellana.svc.cluster.local:8000  -> 400 Bad Request
#      el mismo + Host: gateway                          -> 200
#
# Para apuntar a otro servicio, cambiar las dos cosas a la vez:
#   auth           -> host completo `auth.student-forellana...`  + `Host: auth`
#   subscriptions  -> `subscriptions.student-forellana...`       + `Host: subscriptions`
apiVersion: batch/v1
kind: Job
metadata:
  name: carga-desde-afuera
  labels:
    app: carga-desde-afuera
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: carga-desde-afuera
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.66.3
          args:
            - load
            - -c
            - "4"               # conexiones en paralelo
            - -qps
            - "25"              # peticiones por segundo que pide ESTE notebook
            - -t
            - 30s
            - -H
            - "Host: gateway"   # sin esto: 400 en todas
            - http://gateway.student-forellana.svc.cluster.local:8000/health/
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 150m, memory: 128Mi }
