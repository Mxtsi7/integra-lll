# Carga desde un namespace externo con cuota propia.
# Ruta autorizada: Ingress -> web -> Gateway. No usa el Service interno:
# `40-red.yaml` lo cierra a otros namespaces, aunque en el cluster del ramo
# esa politica no esta aplicada (ver k8s/README.md).
# No enviar Host: gateway: el Ingress necesita el host publico.
#
# kubectl apply -f k8s/pruebas/carga-fortio-otro-namespace.yaml
# kubectl logs -f job/carga-desde-afuera
# kubectl delete -f k8s/pruebas/carga-fortio-otro-namespace.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: carga-desde-afuera
  labels:
    app: carga-desde-afuera
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: carga-desde-afuera
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.66.3
          args:
            - load
            - -c
            - "4"               # conexiones en paralelo
            - -qps
            - "25"              # peticiones por segundo que pide ESTE notebook
            - -t
            - 30s
            # Ingress → web → gateway: la entrada pública, que es lo que se mide.
            - http://ojoalgasto-forellana.dev.censei.cl/health/
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 150m, memory: 128Mi }
