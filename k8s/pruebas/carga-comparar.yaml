# Carga para la comparación con y sin cola. Lo aplica comparar-cola.sh, que
# reemplaza DURACION, CONEXIONES y CANTIDAD_QPS.
#
# Usa un token de sesión válido desde un Secret temporal. Gateway verifica
# la sesión e inyecta la identidad; este pod no tiene acceso directo al dominio.
# Se crea junto con su Secret en student-carga; no cabe en la cuota de la
# aplicación con HPA máximo. La política solo permite este Job hacia Gateway.
apiVersion: batch/v1
kind: Job
metadata:
  name: carga-comparar
  labels: { app: carga-comparar, app.kubernetes.io/part-of: ojoalgasto }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: carga-comparar }
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.66.3
          env:
            - name: TOKEN_CARGA
              valueFrom:
                secretKeyRef: { name: carga-comparar-token, key: token }
          args:
            - load
            - -c
            - "CONEXIONES"
            - -qps
            - "CANTIDAD_QPS"
            - -t
            - DURACION
            - -H
            - "Authorization: Bearer $(TOKEN_CARGA)"
            - -H
            - "Host: gateway"
            - -H
            - "Content-Type: application/json"
            - -payload
            - '{"nombre":"Carga","monto":"9990","moneda":"CLP","frecuencia":"mensual","fecha_proximo_cobro":"2026-11-01","categoria":"streaming","estado":"activo"}'
            - http://gateway.student-forellana.svc.cluster.local:8000/api/suscripciones/
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
