# Carga para la comparación con y sin cola. Lo aplica comparar-cola.sh, que
# reemplaza ORGANIZACION, DURACION, CONEXIONES y CANTIDAD_QPS.
#
# No se aplica a mano: sin esos reemplazos, Fortio manda la palabra
# "ORGANIZACION" como cabecera y el servicio responde 403.
#
# Le pega directo a subscriptions, sin pasar por el gateway. Por eso manda
# X-Organizacion-Id a mano: en producción esa cabecera la inyecta el gateway
# después de validar el JWT (ADR-004), y el servicio confía en ella.
apiVersion: batch/v1
kind: Job
metadata:
  name: carga-comparar
  labels: { app: carga-comparar, app.kubernetes.io/part-of: ojoalgasto }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: carga-comparar }
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.66.3
          args:
            - load
            - -c
            - "CONEXIONES"
            - -qps
            - "CANTIDAD_QPS"
            - -t
            - DURACION
            - -H
            - "X-Organizacion-Id: ORGANIZACION"
            - -H
            - "Content-Type: application/json"
            - -payload
            - '{"nombre":"Carga","monto":"9990","moneda":"CLP","frecuencia":"mensual","fecha_proximo_cobro":"2026-11-01","categoria":"streaming","estado":"activo"}'
            - http://subscriptions:8002/api/suscripciones/
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
