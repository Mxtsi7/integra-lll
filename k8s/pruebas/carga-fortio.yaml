# Prueba de carga con Fortio, desde DENTRO del cluster.
#
# Le pega directo al Service, sin pasar por el ingress ni por el proxy de la
# universidad, así que mide el servicio y no la cadena completa.
#
#   kubectl apply -f k8s/pruebas/carga-fortio.yaml
#   kubectl logs -f job/carga-fortio
#   kubectl delete -f k8s/pruebas/carga-fortio.yaml
#
# Para cambiar el blanco o la intensidad, editar `args` abajo:
#   -c    conexiones en paralelo
#   -qps  peticiones por segundo (0 = tan rápido como pueda)
#   -t    duración
#
# Blancos útiles, de menos a más capas:
#   http://gateway:8000/health/        solo el gateway, sin base de datos
#   http://auth:8001/health/           Django + una consulta a Postgres
#   http://subscriptions:8002/health/  ídem, otro servicio
#
# Con HPA máximo no cabe en el namespace de aplicación: 13/12 pods,
# 2816/2752 MiB. Se conserva como ejemplo del escenario rechazado.
# Para la demo usar carga-fortio-otro-namespace.yaml o estresar.sh con NS_CARGA.
# Verificar con --generador y --namespace-generador explícitos en presupuesto.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: carga-fortio
  labels:
    app: carga-fortio
    app.kubernetes.io/part-of: ojoalgasto
spec:
  # Si falla, que no reintente: un reintento silencioso gasta cuota y confunde
  # la lectura de los resultados.
  backoffLimit: 0
  # Se borra solo 10 minutos después de terminar.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: carga-fortio
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.66.3
          args:
            - load
            - -c
            - "8"
            - -qps
            - "100"
            - -t
            - 30s
            - http://gateway:8000/health/
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
