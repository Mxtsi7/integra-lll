# Servicio auth: registro, login y emisión del JWT.
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  selector: { app: auth }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app.kubernetes.io/part-of: ojoalgasto }
spec:
  replicas: 1
  # La cuota del namespace (2 CPU) no deja espacio para levantar el pod
  # nuevo antes de bajar el viejo: con RollingUpdate el despliegue se traba.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: auth } }
  template:
    metadata:
      labels: { app: auth, app.kubernetes.io/part-of: ojoalgasto }
    spec:
      # Las imágenes viven en un registro privado (GHCR).
      imagePullSecrets:
        - name: ghcr
      initContainers:
        # Las migraciones y el seed corren UNA vez, antes de levantar el
        # servidor. En compose los hacía el entrypoint de cada contenedor;
        # acá se separan para que no se repitan por cada réplica.
        - name: migrar
          image: IMAGEN_AUTH
          imagePullPolicy: Always   # la etiqueta se reutiliza; sin esto el nodo sirve la imagen vieja
          command: ["sh", "entrypoint.sh", "echo", "migraciones listas"]
          envFrom:
            - configMapRef: { name: ojoalgasto }
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SECRET_KEY }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: JWT_SECRET }
            - name: ELIMINACION_INTERNA_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: ELIMINACION_INTERNA_SECRET }
            - name: CLAVES_CIFRADO
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: CLAVES_CIFRADO, optional: true }
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SPOTIFY_CLIENT_ID, optional: true }
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SPOTIFY_CLIENT_SECRET, optional: true }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: GOOGLE_CLIENT_ID, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: GOOGLE_CLIENT_SECRET, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: ANTHROPIC_API_KEY, optional: true }
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: EMAIL_HOST_USER, optional: true }
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: EMAIL_HOST_PASSWORD, optional: true }
            - name: PAGOS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: PAGOS_WEBHOOK_SECRET, optional: true }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: ojoalgasto-bd-auth, key: DATABASE_URL }
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: { name: ojoalgasto-rabbitmq, key: RABBITMQ_URL }
            - { name: ESQUEMA_BD, value: auth }
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            limits:   { cpu: 150m, memory: 256Mi }
      containers:
        - name: auth
          image: IMAGEN_AUTH
          imagePullPolicy: Always   # la etiqueta se reutiliza; sin esto el nodo sirve la imagen vieja
          command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "2", "--access-logfile", "-"]
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: ojoalgasto }
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SECRET_KEY }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: JWT_SECRET }
            - name: ELIMINACION_INTERNA_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: ELIMINACION_INTERNA_SECRET }
            - name: CLAVES_CIFRADO
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: CLAVES_CIFRADO, optional: true }
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SPOTIFY_CLIENT_ID, optional: true }
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: SPOTIFY_CLIENT_SECRET, optional: true }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: GOOGLE_CLIENT_ID, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: GOOGLE_CLIENT_SECRET, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: ANTHROPIC_API_KEY, optional: true }
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: EMAIL_HOST_USER, optional: true }
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: EMAIL_HOST_PASSWORD, optional: true }
            - name: PAGOS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: ojoalgasto, key: PAGOS_WEBHOOK_SECRET, optional: true }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: ojoalgasto-bd-auth, key: DATABASE_URL }
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: { name: ojoalgasto-rabbitmq, key: RABBITMQ_URL }
            - { name: ESQUEMA_BD, value: auth }
            # El initContainer ya sembró: que el contenedor principal no repita.
            - { name: SEED_DEMO, value: "0" }
          # ── Las sondas y el segundo que no alcanza ───────────────────
          # `timeoutSeconds` NO estaba declarado, y por omision vale 1s.
          # `/health/` abre una conexion nueva a Postgres --Django cierra la
          # suya al terminar cada peticion-- y resolver el Service headless
          # mas conectar toma ~3,9s medidos desde este pod, con 150m de CPU
          # de por medio. La sonda nunca alcanzaba a recibir la respuesta: la
          # readiness fallaba, la liveness mataba el contenedor a los 60s y
          # el pod entraba en bucle. Se veia como codigo 137, que es la senal
          # con que kubelet lo mata, no un OOM: la memoria nunca paso de 22Mi.
          #
          # `startupProbe` ademas aparta la liveness mientras arranca: hasta
          # 5 minutos (30 intentos cada 10s) sin que nadie lo mate por tardar.
          startupProbe:
            httpGet:
              path: /health/
              port: 8001
              httpHeaders: [{ name: Host, value: auth }]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8001
              # Con DEBUG=False Django rechaza Hosts desconocidos, y la sonda
              # llega con la IP del pod. Se le manda el Host a mano.
              httpHeaders: [{ name: Host, value: auth }]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8001
              httpHeaders: [{ name: Host, value: auth }]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            # Se queda en 256Mi. Llegue a subirlo a 320 creyendo que el
            # codigo 137 era un OOM; no lo era --`reason` decia `Error`, no
            # `OOMKilled`-- sino kubelet matando el contenedor por la
            # liveness. Medido ya arrancado: 132Mi en uso, 136Mi de pico y
            # `oom_kill 0`. 256Mi sobra, y esos 64Mi hacen falta en la cuota.
            limits:   { cpu: 150m, memory: 256Mi }

---
# Reintentos durables de organización e integrante, usando la imagen de Auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-eliminaciones
  labels:
    app.kubernetes.io/part-of: ojoalgasto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-eliminaciones
  template:
    metadata:
      labels:
        app: auth-eliminaciones
        app.kubernetes.io/part-of: ojoalgasto
    spec:
      imagePullSecrets:
      - name: ghcr
      initContainers:
      - name: esperar-migraciones
        image: IMAGEN_AUTH
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - until python manage.py migrate --check; do sleep 3; done
        envFrom:
        - configMapRef:
            name: ojoalgasto
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: SECRET_KEY }
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: JWT_SECRET }
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: ojoalgasto-bd-auth, key: DATABASE_URL }
        - name: ELIMINACION_INTERNA_SECRET
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: ELIMINACION_INTERNA_SECRET }
        - name: ESQUEMA_BD
          value: auth
        - name: SEED_DEMO
          value: '0'
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
      containers:
      - name: worker
        image: IMAGEN_AUTH
        imagePullPolicy: Always
        command:
        - python
        - manage.py
        - procesar_eliminaciones
        - --continuo
        envFrom:
        - configMapRef:
            name: ojoalgasto
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: SECRET_KEY }
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: JWT_SECRET }
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: ojoalgasto-bd-auth, key: DATABASE_URL }
        - name: ELIMINACION_INTERNA_SECRET
          valueFrom:
            secretKeyRef: { name: ojoalgasto, key: ELIMINACION_INTERNA_SECRET }
        - name: ESQUEMA_BD
          value: auth
        - name: SEED_DEMO
          value: '0'
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
