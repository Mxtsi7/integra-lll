# ══════════════════════════════════════════════════════════════════
# GATEWAY, FRONTEND E INGRESS
#
# El gateway es el ÚNICO componente del backend accesible desde fuera
# del clúster. Los cinco servicios de dominio son ClusterIP y no tienen
# ruta de entrada (ADR-004).
# ══════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway, parte-de: suscripciones }
spec:
  replicas: 2          # el punto de entrada conviene tenerlo replicado
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: REGISTRO/gateway:TAG
          ports: [{ containerPort: 8000 }]
          env:
            # Descubrimiento por nombre: dentro del clúster, el DNS
            # resuelve el nombre del Service. No hay IPs en el código.
            - name: URL_AUTH
              value: http://auth:8001
            - name: URL_SUBSCRIPTIONS
              value: http://subscriptions:8002
            - name: URL_CONNECTORS
              value: http://connectors:8003
            - name: URL_ANALYTICS
              value: http://analytics:8004
            - name: URL_NOTIFICATIONS
              value: http://notifications:8005
          envFrom:
            - configMapRef: { name: config-suscripciones }
            - secretRef: { name: secretos-suscripciones }
          livenessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]

---
# ─── Frontend ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, parte-de: suscripciones }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: REGISTRO/frontend:TAG
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits:   { memory: 256Mi, cpu: 250m }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]

---
# ─── Ingress: la única puerta de entrada al clúster ───────────────
# ⚠️ La clase de Ingress y las anotaciones dependen del clúster.
#    Confirmar con el docente cuál está instalado (nginx, traefik...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suscripciones
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: suscripciones.CAMBIAR.cl
      http:
        paths:
          # Todo lo que empiece con /api va al gateway
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gateway
                port: { number: 8000 }
          # El resto, al frontend
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port: { number: 80 }

---
# ─── Política de red: defensa en profundidad del ADR-004 ──────────
# Impide que algo que no sea el gateway hable con los servicios de
# dominio, aunque alguien se equivoque en la configuración.
#
# ⚠️ Solo funciona si el clúster tiene un plugin de red que soporte
#    NetworkPolicy (Calico, Cilium). Confirmar con el docente.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-gateway-entra
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, subscriptions, connectors, analytics, notifications]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
