# Trabajador de sincronización. Misma imagen, distinto comando y sin Service:
# no atiende peticiones, solo consume la cola.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectors-worker
  labels: { app: connectors-worker, parte-de: suscripciones }
spec:
  replicas: 1
  selector:
    matchLabels: { app: connectors-worker }
  template:
    metadata:
      labels: { app: connectors-worker }
    spec:
      containers:
        - name: worker
          image: REGISTRO/connectors:TAG
          command: ["celery", "-A", "config", "worker", "--beat", "--loglevel=info"]
          env:
            - name: ESQUEMA_BD
              value: connectors
          envFrom:
            - configMapRef: { name: config-suscripciones }
            - secretRef: { name: secretos-suscripciones }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }

