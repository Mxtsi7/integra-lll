# ══════════════════════════════════════════════════════════════════
# SERVICIOS DE DOMINIO
#
# Los cinco son idénticos salvo el nombre, el puerto y el esquema de
# base de datos. Si entiendes uno, entiendes los cinco.
#
# Reemplazar REGISTRO por el registro de imágenes que indique el curso
# (por ejemplo ghcr.io/tu-organizacion) y TAG por la versión.
# ══════════════════════════════════════════════════════════════════

# ─── auth ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app: auth, parte-de: suscripciones }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: REGISTRO/auth:TAG
          ports: [{ containerPort: 8001 }]
          env:
            - name: ESQUEMA_BD
              value: auth
          envFrom:
            - configMapRef: { name: config-suscripciones }
            - secretRef: { name: secretos-suscripciones }
          # Liveness: si falla, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet: { path: /health/, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 30
          # Readiness: si falla, deja de recibir tráfico pero NO se reinicia.
          # Es lo que evita que lleguen peticiones antes de estar listo.
          readinessProbe:
            httpGet: { path: /health/, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  # ClusterIP: visible solo dentro del clúster.
  # Los servicios de dominio NUNCA se exponen al exterior (ADR-004).
  type: ClusterIP
  selector: { app: auth }
  ports: [{ port: 8001, targetPort: 8001 }]

