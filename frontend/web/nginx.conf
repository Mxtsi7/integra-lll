# nginx sirviendo la SPA compilada y haciendo de proxy hacia el gateway.
#
# Lo del proxy no es capricho: el cluster del ramo no deja dos paths en un
# mismo dominio (cada Ingress publica un hostname y solo el path "/"), y no
# hay cert-manager, así que cada dominio extra suma un certificado que el
# navegador no acepta. Con /api/ resuelto acá adentro, la web y la API quedan
# en el MISMO origen: un solo dominio, un solo certificado, y CORS deja de
# existir.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empiece con /api/ va al gateway, con la ruta intacta: el
    # gateway enruta por ese prefijo (/api/auth/, /api/suscripciones/, …).
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host gateway;          # ALLOWED_HOSTS de Django
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # React Router maneja las rutas del lado del navegador: cualquier URL que
    # no sea un archivo real tiene que devolver index.html, o al recargar en
    # /dashboard nginx responde 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre no cambian nunca: se cachean fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Para el liveness/readiness de Kubernetes.
    location = /salud {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
