# ══════════════════════════════════════════════════════════════════
# Levanta el sistema completo con un solo comando:
#     docker compose up --build
#
# Sólo los servicios con healthcheck pueden ser dependencia de otro con
# `condition: service_healthy`. Un proceso que arrancó no es un servicio
# sano: los HTTP prueban su base/Redis, y los workers prueban su cola.
#
# Para trabajar en un servicio puntual, levanta sólo sus dependencias:
#     docker compose up postgres rabbitmq redis auth
# ══════════════════════════════════════════════════════════════════

services:

  # ─── Infraestructura ────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suscripciones
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Crea un esquema por servicio en el primer arranque
      - ./infra/migraciones/01-esquemas.sql:/docker-entrypoint-initdb.d/01-esquemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-suscripciones}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"      # protocolo
      - "15672:15672"    # panel web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ─── Gateway ────────────────────────────────────────────────────

  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    env_file: .env
    environment:
      URL_AUTH: http://auth:8001
      URL_SUBSCRIPTIONS: http://subscriptions:8002
      URL_CONNECTORS: http://connectors:8003
      URL_ANALYTICS: http://analytics:8004
      URL_NOTIFICATIONS: http://notifications:8005
    depends_on:
      auth: { condition: service_healthy }
      subscriptions: { condition: service_healthy }
      connectors: { condition: service_healthy }
      analytics: { condition: service_healthy }
      notifications: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes: ["./gateway:/app", "./shared:/app/shared:ro"]

  # ─── Servicios de dominio ───────────────────────────────────────

  auth:
    build: ./services/auth
    ports: ["8001:8001"]
    env_file: .env
    environment:
      ESQUEMA_BD: auth
      SEED_DEMO: "1"   # usuario de demostración al arrancar (sólo desarrollo)
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    volumes: ["./services/auth:/app", "./shared:/app/shared:ro"]

  subscriptions:
    build: ./services/subscriptions
    ports: ["8002:8002"]
    env_file: .env
    environment:
      ESQUEMA_BD: subscriptions
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  # El actor Temporizador (RF-13): beat programa las tareas periódicas,
  # worker las ejecuta. Mismo código e imagen que subscriptions, distinto
  # punto de entrada; no corren migrate (lo hace subscriptions) y arrancan
  # cuando ese ya está sano, así la base está migrada.
  subscriptions-worker:
    build: ./services/subscriptions
    entrypoint: ["celery", "-A", "config"]
    command: ["worker", "--loglevel=info"]
    # El healthcheck del Dockerfile es HTTP; un worker no sirve HTTP.
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    env_file: .env
    environment:
      ESQUEMA_BD: subscriptions
    depends_on:
      subscriptions: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  subscriptions-beat:
    build: ./services/subscriptions
    entrypoint: ["celery", "-A", "config"]
    # El archivo de estado de beat va fuera de /app para no aparecer en el repo
    command: ["beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    # Beat no expone un canal de consulta. Se declara explícitamente sin
    # healthcheck para no fingir salud: `docker compose ps` lo muestra
    # "running", no "healthy", y ningún servicio depende de él.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      ESQUEMA_BD: subscriptions
    depends_on:
      subscriptions: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  connectors:
    build: ./services/connectors
    ports: ["8003:8003"]
    env_file: .env
    environment:
      ESQUEMA_BD: connectors
    command: ["python", "manage.py", "runserver", "0.0.0.0:8003"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes: ["./services/connectors:/app", "./shared:/app/shared:ro"]

  # Trabajador que ejecuta las sincronizaciones periódicas.
  # Mismo código que connectors, distinto punto de entrada. No migra:
  # espera a que el servicio HTTP haya aplicado las migraciones.
  connectors-worker:
    build: ./services/connectors
    entrypoint: ["celery", "-A", "config"]
    command: ["worker", "--beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    env_file: .env
    environment:
      ESQUEMA_BD: connectors
    depends_on:
      connectors: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./services/connectors:/app", "./shared:/app/shared:ro"]

  analytics:
    build: ./services/analytics
    ports: ["8004:8004"]
    env_file: .env
    environment:
      ESQUEMA_BD: analytics
    command: ["python", "manage.py", "runserver", "0.0.0.0:8004"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes: ["./services/analytics:/app", "./shared:/app/shared:ro"]

  # Consumidor pika de solapamientos. No migra: analytics ya lo hizo.
  # `verificar_worker` comprueba que el proceso siga vivo y que RabbitMQ
  # siga alcanzable; no declara sano un contenedor cuyo consumidor murió.
  analytics-worker:
    build: ./services/analytics
    entrypoint: ["python", "manage.py"]
    command: ["consumir_solapamientos"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "verificar_worker"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    env_file: .env
    environment:
      ESQUEMA_BD: analytics
    depends_on:
      analytics: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/analytics:/app", "./shared:/app/shared:ro"]

  notifications:
    build: ./services/notifications
    ports: ["8005:8005"]
    env_file: .env
    environment:
      ESQUEMA_BD: notifications
    command: ["python", "manage.py", "runserver", "0.0.0.0:8005"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8005/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes: ["./services/notifications:/app", "./shared:/app/shared:ro"]

  # ─── Frontend ───────────────────────────────────────────────────

  frontend:
    # El contexto es frontend/ entero porque web/ importa shared/.
    # No depende del gateway al arrancar: la web lo llama desde el navegador,
    # no desde el contenedor.
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      # Los node_modules quedan dentro del contenedor, no se pisan con los del host
      - /app/node_modules
      - /app/shared/node_modules
      - /app/web/node_modules

volumes:
  datos_postgres:
