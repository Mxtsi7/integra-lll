# ══════════════════════════════════════════════════════════════════
# Levanta el sistema completo con un solo comando:
#     docker compose up --build
#
# Para trabajar en un servicio puntual, levanta solo sus dependencias:
#     docker compose up postgres rabbitmq auth
# ══════════════════════════════════════════════════════════════════

# Credenciales compartidas explícitas para eventos y limpieza. Usar claves hex.
x-eventos: &eventos
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-ojoalgasto}:${RABBITMQ_PASSWORD:?Definir RABBITMQ_PASSWORD en .env}@rabbitmq:5672/
  ELIMINACION_INTERNA_SECRET: ${ELIMINACION_INTERNA_SECRET:?Definir ELIMINACION_INTERNA_SECRET en .env}

services:

  # ─── Infraestructura ────────────────────────────────────────────

  postgres:
    networks: [auth, subscriptions, connectors, analytics, notifications]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suscripciones
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Crea un esquema por servicio en el primer arranque
      - ./infra/migraciones/01-esquemas.sql:/docker-entrypoint-initdb.d/01-esquemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10

  rabbitmq:
    networks: [auth, subscriptions, connectors, analytics, notifications]
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ojoalgasto}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Definir RABBITMQ_PASSWORD en .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    networks: [auth, subscriptions, connectors, analytics, notifications]
    image: redis:7-alpine

  # ─── Gateway ────────────────────────────────────────────────────

  gateway:
    networks: [web, auth, subscriptions, connectors, analytics, notifications]
    build: ./gateway
    ports: ["8000:8000"]
    env_file: .env
    environment:
      URL_AUTH: http://auth:8001
      URL_SUBSCRIPTIONS: http://subscriptions:8002
      URL_CONNECTORS: http://connectors:8003
      URL_ANALYTICS: http://analytics:8004
      URL_NOTIFICATIONS: http://notifications:8005
    depends_on: [auth, subscriptions, connectors, analytics, notifications, redis]
    volumes: ["./gateway:/app", "./shared:/app/shared:ro"]

  # ─── Servicios de dominio ───────────────────────────────────────
  # Todos comparten la misma forma: build, env, depends_on, volumes.

  auth:
    networks: [auth]
    build: ./services/auth
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: auth
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./services/auth:/app", "./shared:/app/shared:ro"]

  auth-eliminaciones:
    networks: [auth, subscriptions, connectors, analytics, notifications]
    build: ./services/auth
    entrypoint: ["python", "manage.py", "procesar_eliminaciones", "--continuo"]
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: auth
    depends_on:
      auth: { condition: service_healthy }
      subscriptions: { condition: service_healthy }
      connectors: { condition: service_healthy }
      analytics: { condition: service_healthy }
      notifications: { condition: service_healthy }
    volumes: ["./services/auth:/app", "./shared:/app/shared:ro"]

  subscriptions:
    networks: [subscriptions]
    build: ./services/subscriptions
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: subscriptions
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  # El actor Temporizador (RF-13): beat programa las tareas periódicas,
  # worker las ejecuta. Mismo código e imagen que subscriptions, distinto
  # punto de entrada; no corren migrate (lo hace subscriptions) y arrancan
  # cuando ese ya está sano, así la base está migrada.
  subscriptions-worker:
    networks: [subscriptions]
    build: ./services/subscriptions
    entrypoint: ["celery", "-A", "config"]
    command: ["worker", "--loglevel=info"]
    # El healthcheck del Dockerfile es HTTP; un worker no sirve HTTP.
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: subscriptions
    depends_on:
      subscriptions: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  subscriptions-beat:
    networks: [subscriptions]
    build: ./services/subscriptions
    entrypoint: ["celery", "-A", "config"]
    # El archivo de estado de beat va fuera de /app para no aparecer en el repo
    command: ["beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: subscriptions
    depends_on:
      subscriptions: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./services/subscriptions:/app", "./shared:/app/shared:ro"]

  connectors:
    networks: [connectors]
    build: ./services/connectors
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: connectors
    command: ["python", "manage.py", "runserver", "0.0.0.0:8003"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/connectors:/app", "./shared:/app/shared:ro"]

  # Trabajador que ejecuta las sincronizaciones periódicas.
  # Mismo código que connectors, distinto punto de entrada.
  connectors-worker:
    networks: [connectors]
    build: ./services/connectors
    command: celery -A config worker --beat --loglevel=info
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: connectors
      APLICAR_MIGRACIONES: "0"
    depends_on:
      connectors: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./services/connectors:/app", "./shared:/app/shared:ro"]

  analytics:
    networks: [analytics]
    build: ./services/analytics
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: analytics
    command: ["python", "manage.py", "runserver", "0.0.0.0:8004"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/analytics:/app", "./shared:/app/shared:ro"]

  # Mismo código e imagen que analytics; migra solo el servidor. Si los dos
  # migraran el mismo esquema a la vez, uno muere con UniqueViolation.
  analytics-worker:
    networks: [analytics]
    build: ./services/analytics
    command: ["python", "manage.py", "consumir_solapamientos"]
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: analytics
      APLICAR_MIGRACIONES: "0"
    depends_on:
      analytics: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/analytics:/app", "./shared:/app/shared:ro"]

  notifications:
    networks: [notifications]
    build: ./services/notifications
    env_file: .env
    environment:
      <<: *eventos
      ESQUEMA_BD: notifications
    command: ["python", "manage.py", "runserver", "0.0.0.0:8005"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes: ["./services/notifications:/app", "./shared:/app/shared:ro"]

  # ─── Frontend ───────────────────────────────────────────────────

  frontend:
    networks: [web]
    # El contexto es frontend/ entero porque web/ importa shared/.
    # No depende del gateway al arrancar: la web lo llama desde el navegador,
    # no desde el contenedor.
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      # Los node_modules quedan dentro del contenedor, no se pisan con los del host
      - /app/node_modules
      - /app/shared/node_modules
      - /app/web/node_modules

volumes:
  datos_postgres:


# Cada dominio solo comparte red con gateway y sus dependencias.
networks:
  web: {}
  auth: {}
  subscriptions: {}
  connectors: {}
  analytics: {}
  notifications: {}
