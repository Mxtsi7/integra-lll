# Se ejecuta en cada pull request y en cada push a main.
# Si algo falla acá, el PR queda en rojo antes de que nadie lo revise.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Backend: un trabajo por servicio, contra un Postgres real ──────
  backend:
    name: backend · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth, subscriptions, gateway, connectors, analytics, notifications]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: suscripciones
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Un RabbitMQ de verdad. Hace falta para la prueba de recorrido completo
      # de subscriptions: un desajuste entre la routing key que se publica y
      # el enlace de la cola es INVISIBLE con dobles —el publicador "publica"
      # y la prueba pasa— y solo aparece contra un broker, donde
      # `mandatory=True` lanza UnroutableError. Ya pasó una vez.
      #
      # Va en todos los trabajos porque `services:` no se puede condicionar
      # por matriz; los que no lo usan solo pagan el arranque. La variable que
      # activa esas pruebas (RABBITMQ_PRUEBA_URL) sí es solo de subscriptions.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      # Lo mismo que .env.example, con la base apuntando al servicio de arriba.
      DEBUG: "True"
      SECRET_KEY: clave-solo-para-ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/suscripciones
      ESQUEMA_BD: ${{ matrix.servicio }}
      # El gateway valida tokens con esto; auth firmara con lo mismo.
      JWT_SECRET: secreto-solo-para-ci
      JWT_ALGORITMO: HS256
      # connectors exige el broker de Celery al cargar sus settings (D-01).
      # Las pruebas no se conectan a él: basta con que la variable exista.
      CELERY_BROKER_URL: redis://localhost:6379/0
      # PYTHONPATH apunta a la raíz para que resuelva shared/, como en Docker.
      PYTHONPATH: ${{ github.workspace }}
      # Solo subscriptions tiene pruebas contra el broker; en los demás queda
      # vacía y esas pruebas se saltan solas.
      RABBITMQ_PRUEBA_URL: ${{ (matrix.servicio == 'subscriptions' || matrix.servicio == 'notifications') && 'amqp://guest:guest@localhost:5672/' || '' }}

    defaults:
      run:
        # gateway vive en la raiz, los demas en services/
        working-directory: ${{ matrix.servicio == 'gateway' && 'gateway' || format('services/{0}', matrix.servicio) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: '**/requirements.txt'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El contrato de `uso.registrado` se prueba de verdad en el borde:
      # Python construye el sobre y el validador TypeScript real lo consume.
      # Sin Node, esa prueba falla a propósito (no se omite), así que acá se
      # prepara el consumidor con sus dependencias.
      - name: Node.js para el contrato cruzado Python → TypeScript
        if: matrix.servicio == 'subscriptions'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/analytics-uso/package-lock.json

      - name: Dependencias del consumidor TypeScript
        if: matrix.servicio == 'subscriptions'
        working-directory: ${{ github.workspace }}/services/analytics-uso
        run: npm ci

      - name: Comprobar la configuración de Django
        run: python manage.py check

      - name: Pruebas
        run: pytest -v

      - name: Imagen real de Notificaciones (migración, contrato y comando)
        if: matrix.servicio == 'notifications'
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f k8s/Dockerfile.servicio --build-arg SERVICIO=services/notifications -t notifications-prueba .
          docker run --rm -e SECRET_KEY=solo-smoke -e DEBUG=False -e DATABASE_URL=sqlite:///:memory: notifications-prueba sh -c 'python manage.py check && python manage.py migrate --noinput && python manage.py help consumir_eventos && python manage.py help reprocesar_fallidos'

  # ── Código compartido: shared/cifrado ──────────────────────────────
  # No pertenece a ningún servicio, así que tiene su propio trabajo. Corre
  # con sqlite en memoria; no necesita Postgres ni variables.
  shared:
    name: shared · cifrado y tenant
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shared/requirements-pruebas.txt

      - name: Instalar dependencias
        run: pip install -r shared/requirements-pruebas.txt

      - name: Pruebas
        run: pytest shared -v

  # ── Consumidor TypeScript de uso: integración real ──────────────────
  # Las pruebas de `services/analytics-uso/tests/integracion` no usan dobles:
  # publican por RabbitMQ, consumen con el worker real y verifican las tablas
  # `uso_*` en PostgreSQL. Con `INTEGRACION_USO=1` dejan de omitirse; acá se
  # levantan ambos servicios para que la barrera de borrado y el evento tardío
  # se ejerzan de verdad en cada PR.
  analytics-uso:
    name: analytics-uso · integración PostgreSQL + RabbitMQ
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: suscripciones
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/suscripciones
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/analytics-uso/package-lock.json

      - name: Instalar dependencias
        working-directory: services/analytics-uso
        run: npm ci

      - name: TypeScript
        working-directory: services/analytics-uso
        run: npm run typecheck

      - name: Pruebas unitarias
        working-directory: services/analytics-uso
        run: npm test

      - name: Integración real (sin omisiones)
        working-directory: services/analytics-uso
        env:
          INTEGRACION_USO: "1"
          EXIGIR_INTEGRACION_USO: "1"
        run: npm run test:integracion

      # El mismo trabajo comprueba el otro lado del contrato: el sobre que
      # arma Python tiene que pasar por este validador TypeScript. Así una
      # regresión de precisión en `ocurrido_en` rompe un solo job, no dos
      # suites que podrían pasar por separado.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Dependencias Python de subscriptions
        run: pip install -r services/subscriptions/requirements.txt

      - name: Contrato cruzado Python → TypeScript
        working-directory: services/subscriptions
        env:
          DEBUG: "True"
          SECRET_KEY: clave-solo-para-ci
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          ESQUEMA_BD: subscriptions
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_uso_contrato_cruzado.py -v

  # ── Frontend: el workspace completo ────────────────────────────────
  frontend:
    name: frontend · typecheck, pruebas y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci falla si package.json y package-lock.json no coinciden:
      # es a propósito, es lo mismo que hace el Dockerfile.
      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

  # ── Guiones de operación ─────────────────────────────────────────────
  # Dos scripts que tocan el cluster de verdad y no se pueden "probar en
  # producción a ver qué pasa". Cada uno tiene un arnés con dobles CON
  # ESTADO que no toca ningún cluster ni ninguna base, y corre en segundos.
  #
  # · rotar-clave-postgres.sh: la base y el Secret son dos estados
  #   independientes (lo que permite representar una desincronización);
  #   dieciocho caminos: feliz, fallo de cada paso, la reanudación después
  #   de cada uno, y la muerte del proceso o un error de escritura al anotar
  #   una fase (el archivo vigente sobrevive).
  # · comparar-cola.sh: cambia EVENTOS_ASINCRONOS en dos deployments y tiene
  #   que dejarlos exactamente como estaban, pase lo que pase: salida normal,
  #   drenaje que no termina, carga interrumpida y rollout de la restauración
  #   fallido.
  operacion:
    name: operación · guiones de k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxis de los guiones
        run: |
          bash -n k8s/rotar-clave-postgres.sh
          bash -n k8s/pruebas/probar-rotacion.sh
          bash -n k8s/desplegar.sh
          bash -n k8s/pruebas/comparar-cola.sh
          bash -n k8s/pruebas/probar-comparar-cola.sh

      - name: Arnés de la rotación (dobles con estado, sin cluster)
        run: bash k8s/pruebas/probar-rotacion.sh

      - name: Presupuesto de recursos Kubernetes
        run: |
          pip install PyYAML==6.0.3
          python -m unittest discover -s k8s/pruebas -p 'test_presupuesto.py'
          python k8s/pruebas/presupuesto.py k8s --generador k8s/pruebas/carga-fortio-otro-namespace.yaml --namespace-generador student-carga
          python k8s/pruebas/presupuesto.py k8s --generador k8s/pruebas/carga-comparar.yaml --namespace-generador student-carga

      - name: Arnés de la comparación (kubectl doble, sin cluster)
        run: bash k8s/pruebas/probar-comparar-cola.sh

      - name: Comparador local de tiempos (HTTP real local, sin cluster)
        run: |
          python -m unittest discover -s scripts/tests -p 'test_comparar*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_estado_comparador.py' -v
          python -m unittest discover -s scripts/tests -p 'test_metricas_comparador.py' -v
          python -m unittest discover -s scripts/tests -p 'test_lanzador_comparador.py' -v

      - name: Generador externo (kubectl doble, sin cluster)
        run: bash k8s/pruebas/probar-carga.sh

      - name: Parches de secretos (kubectl doble, sin cluster)
        run: bash k8s/pruebas/probar-parches-secretos.sh
